name: Update typings

# Regenerates the typings from the annotated schemas, verifies them, and commits
# the result when something changed. Nothing is published to npm from here.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-typings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the generator
        run: npm ci && npm run build

      - name: Generate typings for both manifest versions
        run: |
          node dist/cli.js --ref release-mv3 --outfile .out/mv3.d.ts --metaFile .out/mv3.meta.json --refresh --force
          node dist/cli.js --ref release-mv2 --outfile .out/mv2.d.ts --metaFile .out/mv2.meta.json --refresh --force

      - name: Update the typings package
        id: prepare
        run: node scripts/prepare-typings.mjs

      - name: Verify the typings
        if: steps.prepare.outputs.changed == 'true'
        run: node scripts/verify-typings.mjs

      # The verification above is the gate, so the result goes straight to the branch.
      - name: Commit and push
        id: push
        if: steps.prepare.outputs.changed == 'true'
        env:
          APPLICATION_VERSION: ${{ steps.prepare.outputs.application_version }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
          CHANGED_FILES: ${{ steps.prepare.outputs.changed_files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typings
          git commit -m "Update typings to Thunderbird ${APPLICATION_VERSION}" \
            -m "Package version ${PACKAGE_VERSION}. Changed: ${CHANGED_FILES}. See typings/metadata.json for the schema commits."
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Publishes the commit made above. Uses npm trusted publishing (OIDC), so there
  # is no npm token: the package on npmjs.com must list this repository, this
  # workflow file and the "npm" environment as its trusted publisher.
  publish:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@thunderbirdops/webext-types
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish ./typings --access public
